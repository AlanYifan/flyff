<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 破碎盾牌图标 -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crackGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 破碎的盾牌主体 -->
  <path d="M16 2 L4 8 L4 16 C4 22 10 28 16 30 C22 28 28 22 28 16 L28 8 Z" 
        fill="url(#shieldGradient)" stroke="#3D2914" stroke-width="1.5"/>
  
  <!-- 裂纹效果 -->
  <path d="M8 10 L16 16 L14 24" stroke="url(#crackGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M24 10 L16 16 L18 24" stroke="url(#crackGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M12 6 L16 12 L20 6" stroke="#FF4500" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- 碎片效果 -->
  <polygon points="6,12 4,18 8,16" fill="#8B4513" stroke="#3D2914" stroke-width="0.5"/>
  <polygon points="26,12 28,18 24,16" fill="#8B4513" stroke="#3D2914" stroke-width="0.5"/>
  <polygon points="14,26 16,30 18,26" fill="#8B4513" stroke="#3D2914" stroke-width="0.5"/>
  
  <!-- 高光效果 -->
  <path d="M10 8 L14 10" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>
</svg>
